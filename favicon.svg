<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo azul -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#2563eb"/>
  <!-- Brilho sutil no topo -->
  <rect x="0" y="0" width="100" height="50" rx="22" fill="#3b82f6" opacity="0.35"/>
  <rect x="0" y="50" width="100" height="50" rx="0" fill="#3b82f6" opacity="0"/>
  <!-- Borda interna -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="21" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <!-- 6 pontos do dado -->
  <circle cx="30" cy="28" r="9" fill="white"/>
  <circle cx="70" cy="28" r="9" fill="white"/>
  <circle cx="30" cy="50" r="9" fill="white"/>
  <circle cx="70" cy="50" r="9" fill="white"/>
  <circle cx="30" cy="72" r="9" fill="white"/>
  <circle cx="70" cy="72" r="9" fill="white"/>
</svg>
